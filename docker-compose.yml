services:
  alovy_starterkit_backend_adonisjs:
    container_name: alovy_starterkit_backend_adonisjs
    image: alovy/starterkit-backend:develop
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '3500:3500'
    depends_on:
      alovy_starterkit_database_postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3500/'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 12
    networks:
      - app-network

  alovy_starterkit_database_postgres:
    container_name: alovy_starterkit_database_postgres
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: alovy_starterkit_develop
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
    ports:
      - '5432:5432'
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U testuser -d alovy_starterkit_develop']
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  pgadmin_alovy_starterkit:
    container_name: pgadmin_alovy_starterkit
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@alyvo.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '7090:80'
    depends_on:
      alovy_starterkit_database_postgres:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:

volumes:
  database_data:
  node_modules:
